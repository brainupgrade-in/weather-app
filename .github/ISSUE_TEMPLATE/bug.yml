name: Bug report
description: Report a reproducible problem.
title: "[Bug] "
labels: ["needs-triage"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: jira
    attributes:
      label: Jira key
      description: Add the Jira key if one already exists, for example WAPP-001.
