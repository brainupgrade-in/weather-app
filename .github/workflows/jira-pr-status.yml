name: Report pull request status to Jira

on:
    pull_request:
        types: [opened, closed]

permissions:
    contents: read
    pull-requests: read

jobs:
    report-status:
        if: ${{ vars.JIRA_SYNC_ENABLED == 'true' }}
        runs-on: ubuntu-latest
        steps:
            - name: Report pull request event
              env:
                  GH_TOKEN: ${{ github.token }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  JIRA_BASE_URL: ${{ vars.ATLASSIAN_SITE }}
                  JIRA_USER_EMAIL: ${{ secrets.ATLASSIAN_USER_EMAIL }}
                  JIRA_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
                  PR_TITLE: ${{ github.event.pull_request.title }}
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  PR_ACTION: ${{ github.event.action }}
                  PR_MERGED: ${{ github.event.pull_request.merged }}
              run: |
                  set -euo pipefail

                  jira_key=$(printf '%s' "$PR_TITLE" | grep -Eo '[A-Z][A-Z0-9]+-[0-9]+' | head -n 1 || true)
                  if [[ -z "$jira_key" ]]; then
                    exit 0
                  fi

                  # A merged specification PR (only specs/ files) is not the finished feature, so it must not
                  # move the Jira issue to Done; spec-merged-dispatch.yml starts the implementation instead.
                  non_spec_files=""
                  if [[ "$PR_ACTION" == "closed" && "$PR_MERGED" == "true" ]]; then
                    non_spec_files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
                      --jq '.[].filename | select(startswith("specs/") | not)')
                  fi

                  if [[ "$PR_ACTION" == "closed" && "$PR_MERGED" == "true" && -z "$non_spec_files" ]]; then
                    message="Specification merged: $PR_URL"
                  elif [[ "$PR_ACTION" == "closed" && "$PR_MERGED" == "true" ]]; then
                    transitions=$(curl --fail-with-body --silent --show-error \
                      --user "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
                      --header 'Accept: application/json' \
                      "$JIRA_BASE_URL/rest/api/3/issue/$jira_key/transitions")
                    done_id=$(jq -er '.transitions[] | select(.to.name == "Done") | .id' <<< "$transitions" | head -n 1)
                    curl --fail-with-body --silent --show-error \
                      --user "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
                      --header 'Accept: application/json' \
                      --header 'Content-Type: application/json' \
                      --data "$(jq -n --arg id "$done_id" '{transition: {id: $id}}')" \
                      "$JIRA_BASE_URL/rest/api/3/issue/$jira_key/transitions"
                    message="Pull request merged: $PR_URL"
                  else
                    message="Pull request opened: $PR_URL"
                  fi

                  payload=$(jq -n --arg message "$message" '{body: {type: "doc", version: 1, content: [{type: "paragraph", content: [{type: "text", text: $message}]}]}}')
                  curl --fail-with-body --silent --show-error \
                    --user "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
                    --header 'Accept: application/json' \
                    --header 'Content-Type: application/json' \
                    --data "$payload" \
                    "$JIRA_BASE_URL/rest/api/3/issue/$jira_key/comment"
