name: Create GitHub issue from Jira readiness

on:
    repository_dispatch:
        types: [jira-ready-for-development]

permissions:
    issues: write

jobs:
    create-github-issue:
        runs-on: ubuntu-latest
        steps:
            - name: Create or find GitHub issue
              env:
                  GH_TOKEN: ${{ github.token }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  JIRA_BASE_URL: ${{ vars.ATLASSIAN_SITE }}
                  JIRA_USER_EMAIL: ${{ secrets.ATLASSIAN_USER_EMAIL }}
                  JIRA_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
                  JIRA_KEY: ${{ github.event.client_payload.jira_key }}
                  JIRA_URL: ${{ github.event.client_payload.jira_url }}
                  JIRA_SUMMARY: ${{ github.event.client_payload.summary }}
                  JIRA_DESCRIPTION: ${{ github.event.client_payload.description }}
              run: |
                  set -euo pipefail

                  test -n "$JIRA_KEY"
                  test -n "$JIRA_SUMMARY"

                                    transition_to_in_progress() {
                                        transitions=$(curl --fail-with-body --silent --show-error \
                                            --user "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
                                            --header 'Accept: application/json' \
                                            "$JIRA_BASE_URL/rest/api/3/issue/$JIRA_KEY/transitions")
                                        in_progress_id=$(jq -er '.transitions[] | select(.to.name == "In Progress") | .id' <<< "$transitions" | head -n 1)
                                        curl --fail-with-body --silent --show-error \
                                            --user "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
                                            --header 'Accept: application/json' \
                                            --header 'Content-Type: application/json' \
                                            --data "$(jq -n --arg id "$in_progress_id" '{transition: {id: $id}}')" \
                                            "$JIRA_BASE_URL/rest/api/3/issue/$JIRA_KEY/transitions"
                                    }

                                    existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "${JIRA_KEY} in:title" --json number --jq '.[0].number // empty')
                  if [[ -n "$existing" ]]; then
                                        gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Jira issue is ready for development: $JIRA_URL"
                                        transition_to_in_progress
                    exit 0
                  fi

                                    body=$(printf '%s\n\nJira issue: %s\n\nThis issue was marked agent-ready in Jira. The Copilot agent will implement it and open a draft pull request for human review.' "${JIRA_DESCRIPTION:-No description provided.}" "$JIRA_URL")
                                    gh issue create \
                                        --repo "$GITHUB_REPOSITORY" \
                    --title "[$JIRA_KEY] $JIRA_SUMMARY" \
                    --body "$body" \
                                        --label "agent-ready,jira-synced"
                                    transition_to_in_progress
