name: Dispatch implementation after specification merge

on:
    pull_request:
        types: [closed]

permissions:
    contents: write
    pull-requests: read

jobs:
    dispatch-feature:
        if: ${{ vars.JIRA_SYNC_ENABLED == 'true' && github.event.pull_request.merged == true && !startsWith(github.event.pull_request.title, '[agent]') }}
        runs-on: ubuntu-latest
        steps:
            - name: Dispatch Jira feature implementation
              env:
                  GH_TOKEN: ${{ github.token }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  JIRA_BASE_URL: ${{ vars.ATLASSIAN_SITE }}
                  JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
                  JIRA_USER_EMAIL: ${{ secrets.ATLASSIAN_USER_EMAIL }}
                  JIRA_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
                  PR_TITLE: ${{ github.event.pull_request.title }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  set -euo pipefail

                  # A specification PR is titled "[<Jira key>] ..." and changes only files under specs/.
                  jira_key=$(printf '%s' "$PR_TITLE" | grep -Eo "^\[${JIRA_PROJECT_KEY}-[0-9]+\]" | tr -d '[]' || true)
                  if [[ -z "$jira_key" ]]; then
                    echo "Title does not start with [${JIRA_PROJECT_KEY}-<number>]; not a specification PR."
                    exit 0
                  fi

                  non_spec_files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
                    --jq '.[].filename | select(startswith("specs/") | not)')
                  if [[ -n "$non_spec_files" ]]; then
                    printf 'Not a specification PR; it changes files outside specs/:\n%s\n' "$non_spec_files"
                    exit 0
                  fi

                  issue=$(curl --fail-with-body --silent --show-error \
                    --user "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
                    --header 'Accept: application/json' \
                    "$JIRA_BASE_URL/rest/api/3/issue/$jira_key?fields=summary,description")
                  summary=$(jq -er '.fields.summary' <<< "$issue")
                  description=$(jq -r '.fields.description.content[0].content[0].text // "No description provided."' <<< "$issue")
                  jira_url="$JIRA_BASE_URL/browse/$jira_key"

                  jq -n \
                    --arg event_type jira-ready-for-development \
                    --arg key "$jira_key" \
                    --arg url "$jira_url" \
                    --arg summary "$summary" \
                    --arg description "$description" \
                    '{event_type: $event_type, client_payload: {jira_key: $key, jira_url: $url, summary: $summary, description: $description}}' \
                  | gh api "repos/$GITHUB_REPOSITORY/dispatches" --method POST --input -
